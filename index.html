<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciando com JavaScript</title>
</head>
<body>
    <div>
        <label for="a">Digite o primeiro número: </label>
        <input type="number" id="a" name="a">
    </div>

    <br><br>

    <div>
        <label for="a">Digite o segundo número: </label>
        <input type="number" id="b" name="b">
    </div>

    <br><br>

    <button type="button" onclick="somar()">Somar</button>
    <button type="button" onclick="sub()">Subtrair</button>
    <button type="button" onclick="mult()">Multiplicar</button>
    <button type="button" onclick="pot()">Potenciação</button>

    <h1 id="h1"></h1>
    <h1 id="h2"></h1>
    <h1 id="h3"></h1>
    <h1 id="h4"></h1>

    <script>
        function somar() {
            let inputA = document.querySelector("#a")
            let a = parseInt(inputA.value)

            let inputB = document.querySelector("#b")
            let b = parseInt(inputB.value)

            let s = a + b

            console.log(s)

            let h1 = document.querySelector("#h1")
            h1.textContent = `Soma = ${s}`
        }

        function sub() {
            let inputA = document.querySelector("#a")
            let a = parseInt(inputA.value)

            let inputB = document.querySelector("#b")
            let b = parseInt(inputB.value)

            let sub = a - b

            console.log(sub)

            let h2 = document.querySelector("#h2")
            h2.textContent = `Subtração = ${sub}`
        }

        function mult() {
            let inputA = document.querySelector("#a")
            let a = parseInt(inputA.value)

            let inputB = document.querySelector("#b")
            let b = parseInt(inputB.value)

            let mult = a * b

            console.log(sub)

            let h3 = document.querySelector("#h3")
            h3.textContent = `Multiplicação = ${mult}`
        }

        function pot() {
            let inputA = document.querySelector("#a")
            let a = parseInt(inputA.value)

            let inputB = document.querySelector("#b")
            let b = parseInt(inputB.value)

            let pot = a ** b

            console.log(pot)

            let h4 = document.querySelector("#h4")
            h4.textContent = `A potência = ${pot}`
        }
    </script>
</body>
</html>
